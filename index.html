<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Austruss Reviews have moved</title>
<style>
  :root{--brand:#EB8519;--navy:#3D3D3D;--txt:#111827;--txt2:#4B5563;--bg2:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
    background:var(--navy);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--txt)}
  .card{background:var(--bg2);border-radius:12px;padding:24px 22px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  h1{font-size:18px;margin-bottom:10px}
  p{font-size:14px;line-height:1.55;color:var(--txt2);margin-bottom:12px}
  a.btn,button{display:block;width:100%;text-align:center;padding:10px;border-radius:8px;font-size:14px;font-weight:600;
    text-decoration:none;cursor:pointer;margin-top:8px;font-family:inherit}
  a.btn{background:var(--brand);color:#fff;border:none}
  button{background:#fff;color:var(--txt);border:1px solid #C4CAD4}
  #local{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>Austruss Reviews have moved</h1>
  <p>The MAM / QAM review tool is now at <strong>mam.austrussapps.com</strong>. Sign in there with your name and PIN.</p>
  <div id="local">
    <p><strong>This browser still has <span id="n"></span> review(s) saved from the old version.</strong>
      Download them, then use <strong>↑ Import</strong> in the new app. Reviews that are already there are skipped.</p>
    <button onclick="download()">↓ Download my old reviews</button>
  </div>
  <a class="btn" href="https://mam.austrussapps.com/">Go to the new app</a>
</div>
<script>
// The old app kept everything in this site's localStorage, which the new
// address can't see, so anything still here is offered as a backup file in
// the same format as the old "↓ Backup" button.
function read(key, dflt){
  try{ const v = JSON.parse(localStorage.getItem(key)); return v == null ? dflt : v; } catch(e){ return dflt; }
}
const reviews = read('mam_reviews_v2', []);
if(Array.isArray(reviews) && reviews.length){
  document.getElementById('n').textContent = reviews.length;
  document.getElementById('local').style.display = 'block';
} else {
  location.replace('https://mam.austrussapps.com/');
}
function download(){
  let active = null, activeB = null;
  try{ active = localStorage.getItem('mam_active_template') || null; activeB = localStorage.getItem('mam_active_behav_template') || null; } catch(e){}
  const payload = {
    reviews,
    auditTemplates: read('mam_audit_templates', []), activeTemplateId: active,
    behavTemplates: read('mam_behav_templates', []), activeBehavTemplateId: activeB,
    exportedAt: new Date().toISOString()
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'}));
  a.download = 'mam_backup_old_browser_' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
}
</script>
</body>
</html>
